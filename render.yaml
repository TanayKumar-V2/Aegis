services:
  - type: web
    name: aegis-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aegis-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: RXNORM_BASE_URL
        value: https://rxnav.nlm.nih.gov/REST
      - key: APP_NAME
        value: Aegis
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: aegis-db
    plan: free
